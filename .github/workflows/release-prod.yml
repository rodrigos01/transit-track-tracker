name: Build and Distribute (Prod)

on:
  push:
    branches:
      - master
      - ci-test
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation - no stored GCP key

jobs:
  build-and-distribute:
    name: Build prod release APK and distribute via Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          token_format: access_token

      # Replaces the four "write secret to file" steps this workflow used to
      # have (google-services.json, Firebase credentials, release.jks,
      # local.properties) - all four now come from the same GCS bucket the
      # Claude Cloud environment's SessionStart hook syncs from, so there's
      # one place to rotate them instead of two.
      - name: Sync secrets from bucket
        env:
          GCS_SECRETS_BUCKET: ${{ vars.GCS_SECRETS_BUCKET }}
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REPO_PATH: ${{ github.repository }}
        run: ./scripts/sync-secrets-from-bucket.sh

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build prod release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Distribute prod release via Firebase App Distribution
        run: ./gradlew appDistributionUploadRelease --no-daemon